icon_theme = "breeze-dark"
position = "bottom" 

[[start]]
type = "custom"
name = "launcher-menu"
class = "launcher-menu"

[[start.bar]]
type = "button"
name = "launcher-btn"
label = "󰄛"
on_click = "!rofi -show drun"


[[start]]
type = "launcher"
favorites = []
show_icons = true
show_names = true

[start.truncate]
mode = "end"
max_length = 30

[[end]]
type = "tray"

[[end]]
type = "clock"
orientation="horizontal"

[[end]]
type = "custom"
name = "power-menu"
class = "power-menu"

[[end.bar]]
type = "button"
name = "power-btn"
label = ""
on_click = "popup:toggle"

[[end.popup]]
type = "box"
orientation = "vertical"

[[end.popup.widgets]]
type = "label"
name = "header"
label = "Power menu"

[[end.popup.widgets]]
type = "box"
name = "buttons"

[[end.popup.widgets.widgets]]
type = "button"
class = "power-btn"
label = "<span>󰐥</span>"
on_click = "!shutdown now"

[[end.popup.widgets.widgets]]
type = "button"
class = "power-btn"
label = "<span>󰍃</span>"
tooltip = "Logout"
on_click = "!loginctl terminate-session $XDG_SESSION_ID"

[[end.popup.widgets.widgets]]
type = "button"
class = "power-btn"
label = "<span>󰜉</span>"
on_click = "!reboot"

